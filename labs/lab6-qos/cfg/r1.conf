frr defaults datacenter
hostname r1
!
interface lo
 ip address 10.60.255.1/32
!
! h1(중요 트래픽)이 붙는 포트
interface eth1
 ip address 10.60.1.1/24
!
! h2(대량 트래픽)이 붙는 포트
interface eth2
 ip address 10.60.2.1/24
!
! r2로 가는 좁은 구간. 여기 나가는 쪽에 큐를 만듦(cfg/shape.sh)
interface eth3
 ip address 10.60.0.1/30
 ip ospf network point-to-point
!
! 라우팅은 lab1에서 한 OSPF를 그대로 씀. 이 실습의 주제가 아니므로 최소 설정만 함
router ospf
 ospf router-id 10.60.255.1
 network 10.60.255.1/32 area 0
 network 10.60.0.0/30 area 0
 network 10.60.1.0/24 area 0
 network 10.60.2.0/24 area 0
 passive-interface eth1
 passive-interface eth2
!
