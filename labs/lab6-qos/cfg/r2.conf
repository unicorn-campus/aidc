frr defaults datacenter
hostname r2
!
interface lo
 ip address 10.60.255.2/32
!
! r1로 가는 좁은 구간
interface eth1
 ip address 10.60.0.2/30
 ip ospf network point-to-point
!
! h3(받는 쪽)이 붙는 포트
interface eth2
 ip address 10.60.3.1/24
!
router ospf
 ospf router-id 10.60.255.2
 network 10.60.255.2/32 area 0
 network 10.60.0.0/30 area 0
 network 10.60.3.0/24 area 0
 passive-interface eth2
!
